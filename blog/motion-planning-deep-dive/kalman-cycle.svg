<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="Sintony, sans-serif" font-size="13">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#7c3aed"/>
    </marker>
    <marker id="arr2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#059669"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="rgba(0,0,0,0.12)"/>
    </filter>
  </defs>

  <!-- Predict box -->
  <rect x="30" y="110" width="160" height="100" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2" filter="url(#shadow)"/>
  <text x="110" y="150" text-anchor="middle" font-weight="700" fill="#3b0764" font-size="14">Predict</text>
  <text x="110" y="168" text-anchor="middle" fill="#5b21b6" font-size="11">x̂⁻ₖ = Fₖ x̂ₖ₋₁</text>
  <text x="110" y="183" text-anchor="middle" fill="#5b21b6" font-size="11">P⁻ₖ = Fₖ Pₖ₋₁ Fₖᵀ + Q</text>
  <text x="110" y="198" text-anchor="middle" fill="#7c3aed" font-size="10">State Propagation</text>

  <!-- Update box -->
  <rect x="530" y="110" width="160" height="100" rx="10" fill="#d1fae5" stroke="#059669" stroke-width="2" filter="url(#shadow)"/>
  <text x="610" y="150" text-anchor="middle" font-weight="700" fill="#064e3b" font-size="14">Update</text>
  <text x="610" y="168" text-anchor="middle" fill="#047857" font-size="11">Kₖ = P⁻ₖ Hᵀ (H P⁻ₖ Hᵀ + R)⁻¹</text>
  <text x="610" y="183" text-anchor="middle" fill="#047857" font-size="11">x̂ₖ = x̂⁻ₖ + Kₖ(zₖ − H x̂⁻ₖ)</text>
  <text x="610" y="198" text-anchor="middle" fill="#059669" font-size="10">Measurement Fusion</text>

  <!-- Measurement box (top center) -->
  <rect x="280" y="20" width="160" height="60" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2" filter="url(#shadow)"/>
  <text x="360" y="46" text-anchor="middle" font-weight="700" fill="#78350f" font-size="14">Measurement</text>
  <text x="360" y="63" text-anchor="middle" fill="#92400e" font-size="11">zₖ from sensor</text>

  <!-- State output box (bottom center) -->
  <rect x="280" y="240" width="160" height="60" rx="10" fill="#fde8ee" stroke="#e8174a" stroke-width="2" filter="url(#shadow)"/>
  <text x="360" y="266" text-anchor="middle" font-weight="700" fill="#7a0020" font-size="14">State Estimate</text>
  <text x="360" y="283" text-anchor="middle" fill="#9f1239" font-size="11">x̂ₖ, Pₖ → output</text>

  <!-- Predict → Update arrow (top path through measurement) -->
  <path d="M190,145 Q360,145 530,145" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#arr)" stroke-dasharray="0"/>

  <!-- Measurement → Update arrow -->
  <path d="M360,80 L360,110 Q440,110 530,145" fill="none" stroke="#d97706" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr2)"/>
  <text x="430" y="100" fill="#92400e" font-size="10">inject zₖ</text>

  <!-- Update → State output -->
  <path d="M610,210 L610,270 L440,270" fill="none" stroke="#059669" stroke-width="1.5" marker-end="url(#arr2)"/>

  <!-- State output → Predict (feedback loop) -->
  <path d="M280,270 L110,270 L110,210" fill="none" stroke="#e8174a" stroke-width="2" marker-end="url(#arr)"/>
  <text x="60" y="255" fill="#9f1239" font-size="10">feedback</text>

  <!-- Labels -->
  <text x="340" y="138" fill="#5b21b6" font-size="10">prior estimate</text>
</svg>
