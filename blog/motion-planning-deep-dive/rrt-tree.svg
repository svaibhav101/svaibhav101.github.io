<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="Sintony, sans-serif">
  <rect width="600" height="420" fill="#f8f7f4"/>

  <!-- Grid -->
  <g stroke="#e0deda" stroke-width="0.5">
    <line x1="0" y1="60" x2="600" y2="60"/>
    <line x1="0" y1="120" x2="600" y2="120"/>
    <line x1="0" y1="180" x2="600" y2="180"/>
    <line x1="0" y1="240" x2="600" y2="240"/>
    <line x1="0" y1="300" x2="600" y2="300"/>
    <line x1="0" y1="360" x2="600" y2="360"/>
    <line x1="60" y1="0" x2="60" y2="420"/>
    <line x1="120" y1="0" x2="120" y2="420"/>
    <line x1="180" y1="0" x2="180" y2="420"/>
    <line x1="240" y1="0" x2="240" y2="420"/>
    <line x1="300" y1="0" x2="300" y2="420"/>
    <line x1="360" y1="0" x2="360" y2="420"/>
    <line x1="420" y1="0" x2="420" y2="420"/>
    <line x1="480" y1="0" x2="480" y2="420"/>
    <line x1="540" y1="0" x2="540" y2="420"/>
  </g>

  <!-- Obstacles -->
  <rect x="140" y="80" width="80" height="120" rx="6" fill="#d1d5db" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="180" y="148" text-anchor="middle" fill="#6b7280" font-size="11">OBS</text>
  <rect x="320" y="160" width="100" height="90" rx="6" fill="#d1d5db" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="370" y="213" text-anchor="middle" fill="#6b7280" font-size="11">OBS</text>
  <rect x="160" y="280" width="70" height="80" rx="6" fill="#d1d5db" stroke="#9ca3af" stroke-width="1.5"/>
  <rect x="440" y="60" width="60" height="140" rx="6" fill="#d1d5db" stroke="#9ca3af" stroke-width="1.5"/>

  <!-- RRT tree edges (gray thin) -->
  <g stroke="#a78bfa" stroke-width="1" fill="none" opacity="0.7">
    <line x1="60" y1="380" x2="95" y2="340"/>
    <line x1="95" y1="340" x2="80" y2="295"/>
    <line x1="95" y1="340" x2="130" y2="310"/>
    <line x1="80" y1="295" x2="70" y2="250"/>
    <line x1="80" y1="295" x2="110" y2="270"/>
    <line x1="70" y1="250" x2="90" y2="215"/>
    <line x1="90" y1="215" x2="100" y2="170"/>
    <line x1="100" y1="170" x2="90" y2="130"/>
    <line x1="90" y1="130" x2="120" y2="70"/>
    <line x1="130" y1="310" x2="270" y2="295"/>
    <line x1="270" y1="295" x2="300" y2="270"/>
    <line x1="300" y1="270" x2="318" y2="255"/>
    <line x1="110" y1="270" x2="130" y2="240"/>
    <line x1="270" y1="295" x2="260" y2="360"/>
    <line x1="260" y1="360" x2="310" y2="390"/>
    <line x1="310" y1="390" x2="390" y2="380"/>
    <line x1="390" y1="380" x2="430" y2="370"/>
    <line x1="430" y1="370" x2="480" y2="360"/>
    <line x1="480" y1="360" x2="520" y2="330"/>
    <line x1="520" y1="330" x2="540" y2="300"/>
    <line x1="540" y1="300" x2="550" y2="260"/>
    <line x1="550" y1="260" x2="540" y2="220"/>
    <line x1="318" y1="255" x2="310" y2="155"/>
    <line x1="310" y1="155" x2="300" y2="110"/>
    <line x1="300" y1="110" x2="320" y2="70"/>
    <line x1="320" y1="70" x2="370" y2="50"/>
    <line x1="370" y1="50" x2="420" y2="40"/>
    <line x1="420" y1="40" x2="500" y2="30"/>
    <line x1="500" y1="30" x2="550" y2="50"/>
    <line x1="540" y1="220" x2="550" y2="50"/>
  </g>

  <!-- Optimal path (highlighted) -->
  <polyline points="60,380 95,340 130,310 270,295 300,270 318,255 310,155 300,110 320,70 370,50 420,40 500,30 550,50"
    fill="none" stroke="#e8174a" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- RRT tree nodes -->
  <g fill="#7c3aed">
    <circle cx="95" cy="340" r="3"/>
    <circle cx="80" cy="295" r="3"/>
    <circle cx="70" cy="250" r="3"/>
    <circle cx="90" cy="215" r="3"/>
    <circle cx="100" cy="170" r="3"/>
    <circle cx="90" cy="130" r="3"/>
    <circle cx="130" cy="310" r="3"/>
    <circle cx="270" cy="295" r="3"/>
    <circle cx="300" cy="270" r="3"/>
    <circle cx="318" cy="255" r="3"/>
    <circle cx="310" cy="155" r="3"/>
    <circle cx="300" cy="110" r="3"/>
    <circle cx="260" cy="360" r="3"/>
    <circle cx="480" cy="360" r="3"/>
    <circle cx="540" cy="300" r="3"/>
    <circle cx="550" cy="260" r="3"/>
    <circle cx="540" cy="220" r="3"/>
  </g>
  <!-- Optimal path nodes -->
  <g fill="#e8174a">
    <circle cx="320" cy="70" r="4"/>
    <circle cx="370" cy="50" r="4"/>
    <circle cx="420" cy="40" r="4"/>
  </g>

  <!-- Start -->
  <circle cx="60" cy="380" r="10" fill="#059669" stroke="white" stroke-width="2"/>
  <text x="60" y="384" text-anchor="middle" fill="white" font-size="10" font-weight="700">S</text>

  <!-- Goal -->
  <circle cx="550" cy="50" r="10" fill="#e8174a" stroke="white" stroke-width="2"/>
  <text x="550" y="54" text-anchor="middle" fill="white" font-size="10" font-weight="700">G</text>

  <!-- Legend -->
  <line x1="20" y1="16" x2="45" y2="16" stroke="#a78bfa" stroke-width="1.5"/>
  <circle cx="32" cy="16" r="2.5" fill="#7c3aed"/>
  <text x="50" y="20" fill="#555" font-size="11">Tree edges</text>
  <line x1="130" y1="16" x2="155" y2="16" stroke="#e8174a" stroke-width="2.5"/>
  <text x="160" y="20" fill="#555" font-size="11">Optimal path</text>
  <circle cx="262" cy="16" r="5" fill="#059669" stroke="white" stroke-width="1.5"/>
  <text x="272" y="20" fill="#555" font-size="11">Start</text>
  <circle cx="320" cy="16" r="5" fill="#e8174a" stroke="white" stroke-width="1.5"/>
  <text x="330" y="20" fill="#555" font-size="11">Goal</text>
  <rect x="390" y="10" width="14" height="10" rx="2" fill="#d1d5db" stroke="#9ca3af"/>
  <text x="410" y="20" fill="#555" font-size="11">Obstacle</text>
</svg>
