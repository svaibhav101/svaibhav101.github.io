<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Title -->
  <text x="200" y="25" font-size="20" font-weight="bold" text-anchor="middle" fill="#333">
    Data Structures
  </text>

  <!-- Linked List -->
  <g>
    <text x="50" y="60" font-size="12" font-weight="bold" fill="#333">Linked List</text>
    <rect x="20" y="70" width="30" height="30" fill="#4CAF50" stroke="#333" stroke-width="1.5"/>
    <text x="35" y="92" font-size="10" text-anchor="middle" fill="white">1</text>
    <path d="M 50 85 L 65 85" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    <rect x="70" y="70" width="30" height="30" fill="#4CAF50" stroke="#333" stroke-width="1.5"/>
    <text x="85" y="92" font-size="10" text-anchor="middle" fill="white">2</text>
    <path d="M 100 85 L 115 85" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    <rect x="120" y="70" width="30" height="30" fill="#4CAF50" stroke="#333" stroke-width="1.5"/>
    <text x="135" y="92" font-size="10" text-anchor="middle" fill="white">3</text>
  </g>

  <!-- Binary Tree -->
  <g>
    <text x="220" y="60" font-size="12" font-weight="bold" fill="#333">Binary Tree</text>
    <circle cx="240" cy="85" r="15" fill="#2196F3" stroke="#333" stroke-width="1.5"/>
    <text x="240" y="92" font-size="10" text-anchor="middle" fill="white">A</text>
    <line x1="230" y1="100" x2="200" y2="130" stroke="#333" stroke-width="1.5"/>
    <line x1="250" y1="100" x2="280" y2="130" stroke="#333" stroke-width="1.5"/>
    <circle cx="200" cy="145" r="12" fill="#2196F3" stroke="#333" stroke-width="1.5"/>
    <text x="200" y="150" font-size="9" text-anchor="middle" fill="white">B</text>
    <circle cx="280" cy="145" r="12" fill="#2196F3" stroke="#333" stroke-width="1.5"/>
    <text x="280" y="150" font-size="9" text-anchor="middle" fill="white">C</text>
  </g>

  <!-- Hash Table -->
  <g>
    <text x="50" y="220" font-size="12" font-weight="bold" fill="#333">Hash Table</text>
    <rect x="20" y="230" width="25" height="25" fill="#FF9800" stroke="#333" stroke-width="1"/>
    <text x="32.5" y="248" font-size="8" text-anchor="middle" fill="white">key1</text>
    <rect x="50" y="230" width="25" height="25" fill="#FF9800" stroke="#333" stroke-width="1"/>
    <text x="62.5" y="248" font-size="8" text-anchor="middle" fill="white">key2</text>
    <rect x="80" y="230" width="25" height="25" fill="#FF9800" stroke="#333" stroke-width="1"/>
    <text x="92.5" y="248" font-size="8" text-anchor="middle" fill="white">key3</text>
    <rect x="110" y="230" width="25" height="25" fill="#FF9800" stroke="#333" stroke-width="1"/>
    <text x="122.5" y="248" font-size="8" text-anchor="middle" fill="white">key4</text>
  </g>

  <!-- Stack & Queue -->
  <g>
    <text x="240" y="190" font-size="12" font-weight="bold" fill="#333">Stack</text>
    <rect x="220" y="200" width="35" height="20" fill="#9C27B0" stroke="#333" stroke-width="1.5"/>
    <text x="237.5" y="215" font-size="9" text-anchor="middle" fill="white">Top</text>
    <rect x="220" y="225" width="35" height="20" fill="#9C27B0" stroke="#333" stroke-width="1.5"/>
    <rect x="220" y="250" width="35" height="20" fill="#9C27B0" stroke="#333" stroke-width="1.5"/>

    <text x="310" y="190" font-size="12" font-weight="bold" fill="#333">Queue</text>
    <rect x="285" y="200" width="20" height="35" fill="#E91E63" stroke="#333" stroke-width="1.5"/>
    <text x="295" y="220" font-size="8" text-anchor="middle" fill="white">In</text>
    <rect x="310" y="200" width="20" height="35" fill="#E91E63" stroke="#333" stroke-width="1.5"/>
    <rect x="335" y="200" width="20" height="35" fill="#E91E63" stroke="#333" stroke-width="1.5"/>
    <text x="345" y="220" font-size="8" text-anchor="middle" fill="white">Out</text>
  </g>

  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#333"/>
    </marker>
  </defs>
</svg>
